<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Frosted-Glass-Panel über unscharfer Wohnraum-Szene; Icon-Leiste links,
   Assistent-Leiste oben, schwebende Tab-Leiste unten. Bewusst ein einziger heller Look
   („Tag“) plus manuell wählbare Szene „Abend“ (data-scene). */
:root {
  color-scheme: light;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --text:        #1d1a16;
  --text-2:      #4a433b;
  --muted:       #7b7166;
  --ink:         #1f1c19;   /* dunkle Buttons, Kostenbalken */
  --on-ink:      #ffffff;

  --panel:       rgba(255, 249, 241, .20);
  --panel-line:  rgba(255, 255, 255, .42);
  --card:        rgba(255, 255, 255, .36);
  --card-strong: rgba(255, 255, 255, .66);
  --card-line:   rgba(255, 255, 255, .55);
  --hair:        rgba(70, 48, 24, .10);
  --track:       rgba(70, 48, 24, .10);
  --pill:        rgba(255, 255, 255, .80);

  --teal:        #2f9c84;
  --teal-2:      #1b7764;
  --coral:       #e8664a;
  --yellow:      #e3a90c;
  --blue:        #4b78ec;
  --green:       #34a26c;

  --good:        #137a43;
  --good-bg:     rgba(52, 170, 100, .18);
  --bad:         #b8372d;
  --bad-bg:      rgba(232, 90, 72, .16);
  --warn:        #e3a90c;

  --shadow:      0 30px 60px -20px rgba(60, 36, 12, .35), inset 0 1px 0 rgba(255,255,255,.5);
  --tip-bg:      rgba(255, 255, 255, .94);

  /* Szene (unscharfer Raum) */
  --s-wall-1: #d9c6ad; --s-wall-2: #bfa283; --s-wood: #8a5b37; --s-wood-2: #6b4226;
  --s-tv: #2a2420; --s-floor: #e2d4c1; --s-plant: #6f7d4a; --s-lamp: rgba(255, 196, 120, .55); --s-window: rgba(255, 252, 245, .9);
}
:root[data-scene="evening"] {
  color-scheme: dark;
  --text:        #f4eee6;
  --text-2:      #d6ccbf;
  --muted:       #a99d8f;
  --ink:         #f4eee6;
  --on-ink:      #1d1a16;
  --panel:       rgba(30, 22, 16, .34);
  --panel-line:  rgba(255, 255, 255, .14);
  --card:        rgba(38, 30, 24, .45);
  --card-strong: rgba(56, 46, 38, .72);
  --card-line:   rgba(255, 255, 255, .12);
  --hair:        rgba(255, 255, 255, .09);
  --track:       rgba(255, 255, 255, .12);
  --pill:        rgba(70, 58, 48, .85);
  --good:        #5fd394;
  --good-bg:     rgba(80, 200, 130, .16);
  --bad:         #ff8a78;
  --bad-bg:      rgba(255, 110, 90, .16);
  --shadow:      0 30px 60px -20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255,255,255,.08);
  --tip-bg:      rgba(40, 32, 26, .95);
  --s-wall-1: #4a3a2c; --s-wall-2: #2e241c; --s-wood: #4f3220; --s-wood-2: #352114;
  --s-tv: #0f0c0a; --s-floor: #3a2e24; --s-plant: #2f3a22; --s-lamp: rgba(255, 160, 70, .55); --s-window: rgba(120, 140, 190, .35);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--s-wall-2);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- Szene ---------- */
.scene { position: fixed; inset: -60px; z-index: 0; filter: blur(26px) saturate(1.1); background: linear-gradient(180deg, var(--s-wall-1) 0%, var(--s-wall-2) 62%, var(--s-floor) 100%); transition: background .6s; }
.scene i { position: absolute; display: block; transition: background .6s; }
.scene .window { left: -4%; top: 10%; width: 22%; height: 70%; background: radial-gradient(closest-side, var(--s-window), transparent); }
.scene .shelf  { left: 18%; top: 0; width: 64%; height: 9%; background: var(--s-wood); border-radius: 6px; }
.scene .shelf.l { left: 16%; top: 0; width: 7%; height: 66%; background: var(--s-wood-2); }
.scene .shelf.r { left: 77%; top: 0; width: 7%; height: 66%; background: var(--s-wood-2); }
.scene .tv     { left: 30%; top: 24%; width: 40%; height: 34%; background: var(--s-tv); border-radius: 10px; }
.scene .cab    { left: 18%; top: 62%; width: 64%; height: 14%; background: var(--s-wood); border-radius: 8px; }
.scene .plant  { left: 30%; top: 64%; width: 9%; height: 14%; background: radial-gradient(closest-side, var(--s-plant), transparent); }
.scene .lamp   { left: 70%; top: 8%; width: 36%; height: 50%; background: radial-gradient(closest-side, var(--s-lamp), transparent); }
.scene .floor  { left: -5%; top: 80%; width: 110%; height: 30%; background: var(--s-floor); }
.scene.custom { background-size: cover; background-position: center; filter: blur(10px) saturate(1.05); }
.scene.custom i { display: none; }

/* ---------- Glas ---------- */
.glass {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  backdrop-filter: blur(22px) saturate(1.35);
  box-shadow: var(--shadow);
}
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 18px;
  padding: 18px;
  min-width: 0;
  box-shadow: 0 10px 30px -18px rgba(60, 36, 12, .35);
}
.sub-card { background: var(--card-strong); border: 1px solid var(--card-line); border-radius: 14px; padding: 12px; min-width: 0; }

/* ---------- Grundgerüst ---------- */
.shell {
  position: relative; z-index: 1;
  padding-block: 16px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1480px; margin: 0 auto;
}
.topbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 30;
  height: 50px; border-radius: 999px;
  display: grid; grid-template-columns: 1fr minmax(0, 520px) 1fr; align-items: center; gap: 12px;
  padding: 0 8px 0 6px;
}
.who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; min-width: 0; }
.who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: linear-gradient(135deg, #3a332c, #7a6553); border: 2px solid rgba(255,255,255,.7); }
.assist { position: relative; }
.assist form { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-line); }
.orb { width: 24px; height: 24px; border-radius: 50%; flex: none; background: radial-gradient(circle at 30% 30%, #fff 0 8%, #c9b6ff 22%, #7a5cff 55%, #3a7bff 100%); box-shadow: 0 0 14px rgba(122, 92, 255, .55); animation: orb 4s ease-in-out infinite; }
@keyframes orb { 50% { box-shadow: 0 0 22px rgba(122, 92, 255, .85); transform: scale(1.06); } }
.assist input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 13px; color: var(--text); }
.assist input::placeholder { color: var(--muted); }
.answer { position: absolute; top: 46px; left: 0; right: 0; padding: 14px 16px; border-radius: 16px; font-size: 13px; z-index: 40; }
.answer b { font-weight: 600; }
.answer .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 16px; }
.top-right { display: flex; justify-content: flex-end; }
.bell { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--pill); display: grid; place-items: center; color: var(--text); }
.bell svg { width: 16px; height: 16px; }
.bell .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); border: 1.5px solid var(--pill); }
.notes { position: absolute; top: 56px; right: 0; width: min(340px, calc(100vw - 32px)); border-radius: 18px; padding: 8px; z-index: 40; }
.notes h3 { margin: 6px 10px 8px; font-size: 13px; }
.note { display: flex; gap: 10px; padding: 10px; border-radius: 12px; font-size: 12.5px; color: var(--text-2); }
.note + .note { border-top: 1px solid var(--hair); }
.note i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }

.body-row { display: grid; grid-template-columns: 52px 1fr; gap: 14px; margin-top: 16px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); border-radius: 999px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 20; margin-top: 40px; }
.rail button { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--text-2); transition: background .2s, color .2s; }
.rail button svg { width: 15px; height: 15px; }
.rail button:hover { background: var(--card); }
.rail button.active { background: var(--pill); color: var(--text); box-shadow: 0 4px 12px rgba(60,36,12,.18); }
.rail button .tip { position: absolute; left: 44px; top: 50%; transform: translateY(-50%) translateX(-4px); background: var(--pill); color: var(--text); font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .15s; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; transform: translateY(-50%); }

.panel { border-radius: 30px; padding: 30px 32px 34px; min-height: 70vh; min-width: 0; }
.page { display: none; }
.page.active { display: block; }
.page.enter .card, .page.enter .page-head { animation: cardIn .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes cardIn { from { opacity: 0; filter: blur(14px); transform: translateY(10px) scale(.985); } }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.025em; }
.page-head p { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
.head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Bedienelemente ---------- */
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-line); }
.seg button { white-space: nowrap; flex: none; border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--card-line); background: var(--pill); font-weight: 500; font-size: 13px; color: var(--text); transition: transform .15s, filter .15s; }
.btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
.btn.dark { background: var(--ink); color: var(--on-ink); border-color: transparent; }
.btn.lg { height: 42px; font-size: 13.5px; }
.btn svg { width: 14px; height: 14px; }
.btn { white-space: nowrap; }
.btn.block { width: 100%; }
.mini-btn { border: 0; background: none; color: var(--text-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
.mini-btn:hover { background: var(--card); }
.mini-btn svg { width: 13px; height: 13px; }
.search { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12.5px; padding: 0 8px; border-radius: 8px; }
.search svg { width: 13px; height: 13px; flex: none; }
.search input { border: 0; background: transparent; outline: none; width: 120px; font-size: 12.5px; }
.search input::placeholder { color: var(--text-2); }

.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
.delta svg { width: 8px; height: 8px; }
.delta.up { background: var(--good-bg); color: var(--good); }
.delta.down { background: var(--bad-bg); color: var(--bad); }
.delta-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.label { color: var(--text-2); font-size: 12.5px; font-weight: 500; }
.title { font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
.sub { color: var(--muted); font-size: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 999px; background: var(--card-strong); border: 1px solid var(--card-line); font-size: 11.5px; font-weight: 600; }
.cur { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good); }

/* ---------- Übersicht ---------- */
.ov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; grid-template-areas: "bal tiles pnl" "left act act"; }
.a-bal { grid-area: bal; } .a-tiles { grid-area: tiles; } .a-pnl { grid-area: pnl; } .a-left { grid-area: left; } .a-act { grid-area: act; }
.big { font-size: 30px; font-weight: 600; letter-spacing: -.03em; margin: 6px 0 6px; line-height: 1.15; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 14px; }
.wallets-head { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
.wallets-head span { color: var(--muted); font-weight: 500; }
.wallets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wallet { background: var(--pill); border-radius: 10px; padding: 9px; min-width: 0; }
.wallet .w-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; margin-bottom: 8px; min-width: 0; }
.wallet .w-top span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wallet .w-val { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wallet .w-sub { font-size: 10px; color: var(--muted); margin: 2px 0 6px; }
.wallet .w-st { font-size: 10.5px; font-weight: 600; }
.w-st.on { color: var(--good); } .w-st.off { color: var(--bad); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; }
.tile { border-radius: 14px; padding: 14px; background: var(--card-strong); border: 1px solid var(--card-line); display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 120px; min-width: 0; position: relative; overflow: hidden; }
.tile .row-between .label { font-size: 12px; }
.tile .ico { width: 24px; height: 24px; border-radius: 50%; background: var(--pill); display: grid; place-items: center; flex: none; }
.tile .ico svg { width: 12px; height: 12px; }
.tile .val { font-size: 22px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.hl { background: linear-gradient(150deg, #3fb196 0%, var(--teal) 45%, var(--teal-2) 100%); color: #fff; border-color: rgba(255,255,255,.25); }
.tile.hl .label, .tile.hl .sub { color: rgba(255,255,255,.85); }
.tile.hl .ico { background: rgba(255,255,255,.22); color: #fff; }
.tile.hl .delta.up { background: rgba(255,255,255,.22); color: #fff; }
.tile.hl .delta.down { background: rgba(255,255,255,.22); color: #fff; }
.tile.hl::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.25), transparent); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.axis text { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.gridline { stroke: var(--hair); }

.budget-bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 16px 0 10px; }
.budget-bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--teal-2), var(--teal)); transform-origin: left; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
.budget-bar > div.over { background: linear-gradient(90deg, #c4452f, var(--coral)); }
@keyframes grow { from { transform: scaleX(0); } }

.cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pcard { border-radius: 14px; padding: 12px; color: #fff; aspect-ratio: 1.58; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; min-width: 0; }
.pcard.black { background: linear-gradient(140deg, #3a3633, #121110); }
.pcard.teal { background: linear-gradient(140deg, #49b89d, #1b7764); }
.pcard::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.18), transparent 60%); }
.pcard .p-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; position: relative; z-index: 1; }
.pcard .p-st { background: #fff; color: #111; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pcard .p-chip { width: 26px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, #e8d6a4, #b39555); }
.pcard .p-num { font-size: 12px; letter-spacing: .12em; position: relative; z-index: 1; }
.pcard .p-foot { display: flex; justify-content: space-between; font-size: 10px; opacity: .85; position: relative; z-index: 1; gap: 6px; }

/* Tabelle */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
thead th { text-align: left; font-weight: 500; color: var(--text-2); padding: 11px 12px; background: var(--card-strong); white-space: nowrap; }
thead th:first-child { border-radius: 12px 0 0 12px; }
thead th:last-child { border-radius: 0 12px 12px 0; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
tbody td { padding: 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255,255,255,.12); }
td.r, th.r { text-align: right; }
.cb { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--card-line); background: var(--pill); display: inline-block; vertical-align: middle; }
.act-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.act-ico { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: #fff; flex: none; }
.act-ico svg { width: 11px; height: 11px; }
.status { display: inline-flex; align-items: center; gap: 6px; }
.status i { width: 6px; height: 6px; border-radius: 50%; }
.amt-in { color: var(--good); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px !important; }

/* ---------- Berichte ---------- */
.kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi { display: flex; flex-direction: column; gap: 10px; }
.kpi .k-top { display: flex; align-items: center; gap: 8px; }
.kpi .k-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.kpi .k-ico svg { width: 12px; height: 12px; }
.kpi .k-val { font-size: 24px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rep-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.donut-wrap { display: grid; place-items: center; margin: 4px 0 14px; }
.donut-wrap svg { width: min(190px, 100%); height: auto; overflow: visible; }
.cat-list { display: flex; flex-direction: column; gap: 9px; }
.cat { display: grid; grid-template-columns: 112px 1fr 40px; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }
.cat > span:first-child { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.cat .track { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
.cat .track div { height: 100%; border-radius: 4px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
.cat b { text-align: right; font-weight: 600; color: var(--text); }
.stmt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--hair); }

/* ---------- Ziele ---------- */
.sav-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }

.auto-row .a-ico { width: 32px; height: 32px; border-radius: 50%; background: var(--card-strong); display: grid; place-items: center; flex: none; }
.auto-row .a-ico svg { width: 14px; height: 14px; }
.auto-row .a-main { flex: 1; min-width: 0; }

.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
.switch input:checked + span { background: var(--coral); }

.goal .ring { display: grid; place-items: center; margin: 4px 0; }

/* ---------- Konto ---------- */
.acc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

code { overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--card-strong); padding: 1px 5px; border-radius: 5px; }

/* ---------- Tab-Leiste ---------- */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%);

.tooltip { position: absolute; pointer-events: none; z-index: 60; min-width: 150px; padding: 10px 12px; border-radius: 12px; background: var(--tip-bg); border: 1px solid var(--card-line); box-shadow: 0 14px 32px rgba(40, 24, 8, .25); font-size: 12px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; color: var(--text); }

dialog { border: 1px solid var(--panel-line); border-radius: 24px; padding: 24px; width: min(440px, calc(100vw - 32px)); color: var(--text); background: var(--tip-bg); box-shadow: 0 40px 80px rgba(40, 24, 8, .35); }
dialog::backdrop { background: rgba(40, 28, 16, .25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
dialog h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.015em; }
dialog .d-sub { margin: 0 0 18px; color: var(--muted); font-size: 12.5px; }
dialog .d-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); transform: translate(-50%, 16px); opacity: 0; transition: .25s; z-index: 70; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; pointer-events: none; color: var(--text); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {

  .saved, .acc-grid { grid-template-columns: minmax(0, 1fr); }
  .page-head h1 { font-size: 23px; }

}

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
"use strict";
/* =========================================================
   Konstanten
   ========================================================= */
const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONTHS_LONG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

  { key: "personal",  name: "Personal",         color: "var(--coral)" },

];
const CSV_COLS = ["monat", "einnahmen", ...CATS.map(c => c.key)];
const STATUS = {
  done:    { name: "Abgeschlossen",  color: "var(--green)" },
  pending: { name: "Ausstehend",     color: "var(--coral)" },
  running: { name: "In Bearbeitung", color: "var(--warn)" },
};
const PAGES = [
  { id: "overview", name: "Übersicht",  icon: "home" },
  { id: "activity", name: "Aktivität",  icon: "bolt" },
  { id: "goals",    name: "Ziele",      icon: "stack" },
  { id: "reports",  name: "Berichte",   icon: "pie" },
  { id: "account",  name: "Konto",      icon: "gear" },
];
const I = {
  home:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>',
  bolt:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',

  arrOut:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg>',

};
const GOAL_ICONS = ["shield", "factory", "doc", "building", "mega", "target"];

/* =========================================================
   Beispieldaten (deterministisch) – über Konto › Daten ersetzbar
   ========================================================= */
function seeded(s) { return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

function demoMonths() {
  const r = seeded(11), rows = [];
  for (let i = 0; i < 24; i++) {
    const d = new Date(2024, 10 + i, 1);
    const season = 1 + .07 * Math.sin((d.getMonth() + 1) / 12 * Math.PI * 2) + (d.getMonth() === 11 ? .08 : 0);
    const ein = Math.round((352000 + i * 4300) * season * (.93 + r() * .14));
    rows.push({
      monat: ym(d), einnahmen: ein,
      personal:  Math.round(118000 + i * 950 + r() * 6000),
      material:  Math.round(ein * (.19 + r() * .05)),
      software:  Math.round(25000 + i * 380 + r() * 3500),
      marketing: Math.round(ein * (.055 + r() * .04)),
      sonstiges: Math.round(13000 + r() * 8000),
    });
  }
  return rows;
}

function demoTx() {
  const r = seeded(5);
  const tpl = [
    ["Kundenzahlung Projekt Nordlicht", "einnahmen", 38000, 62000],
    ["Abo-Erlöse Software", "einnahmen", 21000, 34000],
    ["Wartungsvertrag Q4", "einnahmen", 12000, 26000],
    ["Lizenzverkauf Enterprise", "einnahmen", 30000, 48000],
    ["Gehaltslauf", "personal", 52000, 64000],
    ["Materialeinkauf Lieferant", "material", 9000, 24000],
    ["Cloud-Hosting", "software", 3200, 6800],
    ["Online-Ads Kampagne", "marketing", 4200, 11000],
    ["Messestand Planung", "marketing", 7500, 15000],
    ["Büromiete", "sonstiges", 8400, 8400],
    ["Reisekosten Vertrieb", "sonstiges", 900, 3600],
    ["Software-Lizenzen", "software", 1800, 5200],
  ];
  const out = [];
  let t = new Date(2026, 9, 24, 15, 45).getTime();
  for (let i = 0; i < 34; i++) {
    const [name, cat, lo, hi] = tpl[Math.floor(r() * tpl.length)];
    const amt = Math.round((lo + r() * (hi - lo)) / 10) * 10;
    const st = i < 2 ? "pending" : i < 4 ? "running" : r() < .08 ? "pending" : "done";
    out.push({ id: `RE-${String(2186 - i).padStart(6, "0")}`, name, cat, amount: cat === "einnahmen" ? amt : -amt, status: st, date: new Date(t).toISOString() });
    t -= (8 + r() * 40) * 3600e3;
  }
  return out;
}

    ],
    auto: { round: true, profit: true, tax: false },
  };
}

/* =========================================================
   Zustand & Speicher (nur lokal im Browser)
   ========================================================= */
const LS = "glass-cockpit-v1";
let S = (() => {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && Array.isArray(s.months) && s.months.length > 1) return { ...defaults(), ...s }; } catch (_) {}
  return defaults();

const NS = "http://www.w3.org/2000/svg";

function niceTicks(min, max, count = 4) {
  const span = max - min || 1, raw = span / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= count) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];

}

const hideTip = () => tip.classList.remove("show");
function smooth(p) {
  if (p.length < 2) return `M${p[0][0]},${p[0][1]}`;

/** Liniendiagramm mit Fläche, Crosshair und Tooltip */
function lineChart(box, { labels, series, tipHtml }) {

  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = series.flatMap(s => s.values);
  const ticks = niceTicks(0, Math.max(...all) * 1.05, 4), top = ticks[ticks.length - 1];
  const X = i => m.l + (labels.length < 2 ? iw / 2 : i * iw / (labels.length - 1));
  const Y = v => m.t + ih - v / top * ih;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, box);
  const defs = el("defs", {}, svg);
  const ax = axes(svg, { W, m, ih, Y, ticks, fmt: axisK });
  const every = Math.ceil(labels.length / Math.max(2, Math.floor(iw / 60)));
  labels.forEach((l, i) => { if (i % every && i !== labels.length - 1) return; el("text", { x: X(i), y: H - 4, "text-anchor": i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle" }, ax).textContent = l; });
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => [X(i), Y(v)]), d = smooth(pts);
    if (s.area) {
      const id = "lg" + si + Math.random().toString(36).slice(2, 6);
      const lg = el("linearGradient", { id, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
      el("stop", { offset: "0", style: `stop-color:${s.color};stop-opacity:.32` }, lg);
      el("stop", { offset: "1", style: `stop-color:${s.color};stop-opacity:0` }, lg);
      el("path", { d: `${d}L${X(pts.length - 1)},${m.t + ih}L${X(0)},${m.t + ih}Z`, fill: `url(#${id})` }, svg);
    }
    const p = el("path", { d, fill: "none", style: `stroke:${s.color}`, "stroke-width": 2.2, "stroke-linecap": "round" }, svg);
    const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    requestAnimationFrame(() => { p.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)"; p.style.strokeDashoffset = 0; });
  });
  const cross = el("line", { y1: m.t, y2: m.t + ih, style: "stroke:var(--muted)", "stroke-dasharray": "3 3", opacity: 0 }, svg);
  const dots = series.map(s => el("circle", { r: 4.5, style: `fill:${s.color};stroke:var(--pill)`, "stroke-width": 2, opacity: 0 }, svg));
  const hit = el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, svg);

    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - svg.getBoundingClientRect().left;

/** Ring-Diagramm mit Lücken */
function donut(box, parts, total, centerSub) {
  const S0 = 200, c = S0 / 2, R = 78, w = 22, gap = .035;
  let a = -Math.PI / 2;
  const arcs = parts.map(p => {
    const sweep = p.value / total * Math.PI * 2, a0 = a + gap / 2, a1 = a + sweep - gap / 2; a += sweep;
    const pt = (ang, rad) => [c + Math.cos(ang) * rad, c + Math.sin(ang) * rad];
    const [x0, y0] = pt(a0, R + w / 2), [x1, y1] = pt(a1, R + w / 2), [x2, y2] = pt(a1, R - w / 2), [x3, y3] = pt(a0, R - w / 2);
    const lg = a1 - a0 > Math.PI ? 1 : 0;
    return `<path data-k="${p.key}" d="M${x0},${y0}A${R + w / 2},${R + w / 2} 0 ${lg} 1 ${x1},${y1}L${x2},${y2}A${R - w / 2},${R - w / 2} 0 ${lg} 0 ${x3},${y3}Z" style="fill:${p.color};transition:opacity .2s"/>`;
  }).join("");
  box.innerHTML = `<svg viewBox="0 0 ${S0} ${S0}" role="img" aria-label="Kosten nach Kategorie">${arcs}
    <text x="${c}" y="${c - 16}" text-anchor="middle" style="fill:var(--muted);font-size:10px" id="dnLab">Gesamtkosten</text>
    <text x="${c}" y="${c + 6}" text-anchor="middle" style="fill:var(--text);font-size:19px;font-weight:700" class="num" id="dnVal">${eurK(total)}</text>
    <text x="${c}" y="${c + 22}" text-anchor="middle" style="fill:var(--muted);font-size:10px" id="dnSub">${centerSub}</text></svg>`;
  const svg = box.firstChild;
  svg.querySelectorAll("path").forEach(p => {
    const part = parts.find(x => x.key === p.dataset.k);
    p.addEventListener("mouseenter", () => {
      svg.querySelectorAll("path").forEach(o => o.style.opacity = o === p ? 1 : .3);
      $("#dnLab", svg).textContent = part.name; $("#dnVal", svg).textContent = eurK(part.value); $("#dnSub", svg).textContent = pct(part.value / total * 100) + " der Kosten";
    });
    p.addEventListener("mouseleave", () => {
      svg.querySelectorAll("path").forEach(o => o.style.opacity = 1);
      $("#dnLab", svg).textContent = "Gesamtkosten"; $("#dnVal", svg).textContent = eurK(total); $("#dnSub", svg).textContent = centerSub;
    });
  });
}

function notifications() {
  const n = S.months.length, cur = S.months[n - 1], prev = S.months[n - 2];
  const out = [];
  const pend = S.tx.filter(t => t.status === "pending");
  if (pend.length) out.push({ c: "var(--coral)", t: `${pend.length} Vorgang${pend.length > 1 ? "e" : ""} ausstehend, zuletzt ${esc(pend[0].name)} (${eur(Math.abs(pend[0].amount), 0)}).` });
  const mk = change(cur.marketing, prev.marketing);
  if (Math.abs(mk) > 10) out.push({ c: "var(--blue)", t: `Marketingkosten ${mk > 0 ? "+" : "−"}${nf(Math.abs(mk), 0)} % ggü. Vormonat.` });
  if (costOf(cur) > S.budget) out.push({ c: "var(--bad)", t: `Kostenbudget im ${MONTHS_LONG[+cur.monat.slice(5) - 1]} um ${eur(costOf(cur) - S.budget, 0)} überschritten.` });

  return out.length ? out : [{ c: "var(--muted)", t: "Keine neuen Hinweise." }];
}

/* =========================================================
   Kennzahlen-Assistent (regelbasiert, rechnet mit den geladenen Daten)
   ========================================================= */
const PROMPTS = ["Wie hoch war der Umsatz in den letzten 12 Monaten?", "Wie entwickelt sich die Marge?", "Welcher Monat war der beste?", "Wie viel kostet Marketing?", "Wie stehen unsere Rücklagen?"];
function answer(q) {
  q = q.toLowerCase();
  const { cur, prev } = period(12), a = agg(cur), b = prev.length === 12 ? agg(prev) : null;
  const vs = (x, y) => b ? ` (${x >= y ? "+" : "−"}${nf(Math.abs(change(x, y)), 1)} % ggü. Vorjahreszeitraum)` : "";
  const cat = CATS.find(c => q.includes(c.key) || q.includes(c.name.toLowerCase().split(" ")[0]));
  if (cat) return { go: "reports", html: `<b>${cat.name}</b> kostete in den letzten 12 Monaten <b>${eurK(a.cats[cat.key])}</b>, das sind ${pct(a.cats[cat.key] / a.kosten * 100)} der Gesamtkosten${b ? vs(a.cats[cat.key], b.cats[cat.key]) : ""}.` };
  if (/best|stärkst|höchst/.test(q)) { const m = cur.reduce((x, y) => profitOf(y) > profitOf(x) ? y : x); return { go: "reports", html: `Bester Monat nach Gewinn: <b>${mLong(m.monat)}</b> mit ${eurK(profitOf(m))} Gewinn bei ${eurK(m.einnahmen)} Umsatz.` }; }
  if (/schlecht|schwäch|niedrig/.test(q)) { const m = cur.reduce((x, y) => profitOf(y) < profitOf(x) ? y : x); return { go: "reports", html: `Schwächster Monat nach Gewinn: <b>${mLong(m.monat)}</b> mit ${eurK(profitOf(m))} Gewinn.` }; }
  if (/marge|rendite|quote/.test(q)) return { go: "reports", html: `Umsatzrendite der letzten 12 Monate: <b>${pct(a.quote)}</b>${b ? ` (Vorjahreszeitraum ${pct(b.quote)})` : ""}. Die Bruttomarge nach Material liegt bei ${pct((a.ein - a.cats.material) / a.ein * 100)}.` };
  if (/gewinn|ergebnis|profit|ebit/.test(q)) return { go: "reports", html: `Nettogewinn der letzten 12 Monate: <b>${eurK(a.gewinn)}</b>${vs(a.gewinn, b && b.gewinn)}.` };
  if (/kosten|ausgab/.test(q)) return { go: "reports", html: `Gesamtkosten der letzten 12 Monate: <b>${eurK(a.kosten)}</b>${vs(a.kosten, b && b.kosten)}. Größter Block: ${CATS.reduce((x, y) => a.cats[y.key] > a.cats[x.key] ? y : x).name}.` };
  if (/rücklag|ziel|reserve|spar/.test(q)) { const s = S.goals.reduce((x, g) => x + g.saved, 0), t = S.goals.reduce((x, g) => x + g.target, 0); return { go: "goals", html: `Rücklagen gesamt: <b>${eur(s, 0)}</b>, das sind ${pct(s / t * 100, 0)} der Zielsumme von ${eurK(t)}.` }; }
  if (/liquid|konto|kontost|cash|bank/.test(q)) return { go: "overview", html: `Liquidität über alle Konten: <b>${eur(balanceTotal())}</b>.` };
  if (/umsatz|einnahm|erlös/.test(q)) return { go: "reports", html: `Umsatz der letzten 12 Monate: <b>${eurK(a.ein)}</b>${vs(a.ein, b && b.ein)}.` };
  return { html: `Dazu habe ich keine Kennzahl. Fragen Sie z. B. nach <b>Umsatz</b>, <b>Kosten</b>, <b>Gewinn</b>, <b>Marge</b>, einer Kostenkategorie, dem <b>besten Monat</b> oder den <b>Rücklagen</b>.` };
}

/* =========================================================
   Dialoge
   ========================================================= */
const dlg = $("#dlg"), dlgForm = $("#dlgForm");
function openDialog(html, onSubmit) {
  dlgForm.innerHTML = html;
  dlgForm.onsubmit = e => {
    if (e.submitter && e.submitter.value === "cancel") return;
    e.preventDefault();
    if (onSubmit(new FormData(dlgForm)) !== false) dlg.close();
  };
  dlg.showModal();
  const first = dlgForm.querySelector("input, select, textarea"); if (first) first.focus();
}
const cancelBtn = `<button class="btn" value="cancel" formnovalidate>Abbrechen</button>`;

function quickAdd() {
  const today = new Date().toISOString().slice(0, 10);
  openDialog(`
    <h2>Neue Buchung</h2><p class="d-sub">Wird in der Aktivitätenliste und in den Monatszahlen berücksichtigt.</p>
    <div class="field"><label for="q-name">Vorgang</label><input id="q-name" name="name" required placeholder="z. B. Kundenzahlung Projekt Atlas"></div>
    <div class="two">
      <div class="field"><label for="q-cat">Art</label><select id="q-cat" name="cat"><option value="einnahmen">Einnahme</option>${CATS.map(c => `<option value="${c.key}">Ausgabe · ${c.name}</option>`).join("")}</select></div>
      <div class="field"><label for="q-amt">Betrag (€)</label><input id="q-amt" name="amount" type="number" min="0.01" step="0.01" required></div>
    </div>
    <div class="two">
      <div class="field"><label for="q-st">Status</label><select id="q-st" name="status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("")}</select></div>
      <div class="field"><label for="q-date">Datum</label><input id="q-date" name="date" type="date" value="${today}" required></div>
    </div>
    <div class="d-actions">${cancelBtn}<button class="btn dark" type="submit">Buchen</button></div>`,
  fd => {
    const amt = +fd.get("amount"), cat = fd.get("cat"), date = new Date(fd.get("date") + "T12:00:00");
    const maxId = Math.max(0, ...S.tx.map(t => +t.id.replace(/\D/g, "")));
    S.tx.unshift({ id: `RE-${String(maxId + 1).padStart(6, "0")}`, name: fd.get("name"), cat, amount: cat === "einnahmen" ? amt : -amt, status: fd.get("status"), date: date.toISOString() });
    S.tx.sort((a, b) => b.date.localeCompare(a.date));
    const row = S.months.find(r => r.monat === ym(date));
    if (row) row[cat] += amt;
    const acc = S.accounts[0]; acc.bal += cat === "einnahmen" ? amt : -amt;
    persist(row ? "Buchung erfasst" : "Buchung erfasst (Monat liegt außerhalb der Kennzahlen)"); render();
  });
}
function addMoney(i) {
  const g = S.goals[i];
  openDialog(`
    <h2>Betrag zuführen</h2><p class="d-sub">${esc(g.name)} · ${eurK(g.saved)} von ${eurK(g.target)}</p>
    <div class="field"><label for="m-amt">Betrag (€)</label><input id="m-amt" name="amount" type="number" min="1" step="1" required value="${Math.round(Math.min(10000, Math.max(1, g.target - g.saved)))}"></div>
    <div class="d-actions">${cancelBtn}<button class="btn dark" type="submit">Zuführen</button></div>`,
  fd => { g.saved += +fd.get("amount"); persist(`${eur(+fd.get("amount"), 0)} zu „${g.name}“ hinzugefügt`); render(); });
}
function newGoal() {
  openDialog(`
    <h2>Neues Ziel</h2><p class="d-sub">Eine Rücklage mit Zielbetrag und Termin.</p>
    <div class="field"><label for="g-name">Bezeichnung</label><input id="g-name" name="name" required placeholder="z. B. Fuhrpark erneuern"></div>
    <div class="two">
      <div class="field"><label for="g-target">Zielbetrag (€)</label><input id="g-target" name="target" type="number" min="1" required></div>
      <div class="field"><label for="g-due">Termin</label><input id="g-due" name="due" type="month" required value="2027-06"></div>
    </div>
    <div class="field"><label for="g-saved">Bereits zurückgelegt (€)</label><input id="g-saved" name="saved" type="number" min="0" value="0"></div>
    <div class="d-actions">${cancelBtn}<button class="btn dark" type="submit">Ziel anlegen</button></div>`,
  fd => {
    S.goals.push({ name: fd.get("name"), target: +fd.get("target"), saved: +fd.get("saved") || 0, due: fd.get("due") || "2027-12", icon: GOAL_ICONS[S.goals.length % GOAL_ICONS.length] });
    persist("Ziel angelegt"); render();
  });

function editBudget() {
  openDialog(`
    <h2>Kostenbudget</h2><p class="d-sub">Monatliche Obergrenze für alle Kosten.</p>
    <div class="field"><label for="b-amt">Budget pro Monat (€)</label><input id="b-amt" name="budget" type="number" min="0" step="1000" required value="${S.budget}"></div>
    <div class="d-actions">${cancelBtn}<button class="btn dark" type="submit">Speichern</button></div>`,
  fd => { S.budget = +fd.get("budget"); persist("Budget gespeichert"); render(); });
}
function confirmReset() {
  openDialog(`
    <h2>Beispieldaten wiederherstellen?</h2><p class="d-sub">Importierte Zahlen, eigene Buchungen und Ziele werden durch die Beispieldaten ersetzt. Profil und Darstellung bleiben erhalten.</p>
    <div class="d-actions">${cancelBtn}<button class="btn dark" type="submit">Wiederherstellen</button></div>`,
  () => { const d = defaults(); Object.assign(S, { months: d.months, tx: d.tx, goals: d.goals, accounts: d.accounts, auto: d.auto }); persist("Beispieldaten wiederhergestellt"); render(); });
}

/* =========================================================
   CSV
   ========================================================= */
function parseCSV(text) {
  const lines = text.replace(/^﻿/, "").trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 3) throw new Error("mindestens Kopfzeile und zwei Monate erforderlich.");
  const delim = lines[0].includes(";") ? ";" : ",";
  const head = lines[0].split(delim).map(h => h.trim().toLowerCase().replace(/"/g, ""));
  const missing = CSV_COLS.filter(c => !head.includes(c));
  if (missing.length) throw new Error("Spalte(n) fehlen: " + missing.join(", ") + ".");
  const num = (s, line) => {
    s = (s || "").trim().replace(/"/g, "").replace(/\s|€/g, "");
    if (delim === ";") s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s); if (!isFinite(n)) throw new Error(`ungültige Zahl „${s}“ in Zeile ${line}.`); return n;
  };
  return lines.slice(1).map((l, i) => {
    const cells = l.split(delim), r = {};
    head.forEach((h, j) => { if (CSV_COLS.includes(h)) r[h] = h === "monat" ? (cells[j] || "").trim().replace(/"/g, "") : num(cells[j], i + 2); });
    if (!/^\d{4}-\d{2}$/.test(r.monat)) throw new Error(`Monat „${r.monat}“ in Zeile ${i + 2} muss das Format JJJJ-MM haben.`);
    return r;
  }).sort((a, b) => a.monat.localeCompare(b.monat));
}
function toCSV(rows) {
  return [CSV_COLS.join(";"), ...rows.map(r => CSV_COLS.map(c => c === "monat" ? r[c] : String(r[c]).replace(".", ",")).join(";"))].join("\n");
}
function showCSV(title, csv, filename) {
  openDialog(`
    <h2>${esc(title)}</h2><p class="d-sub">Kopieren und z. B. in Excel einfügen, oder als Datei speichern.</p>
    <div class="field"><label for="csvOut">CSV (Trennzeichen ;)</label><textarea id="csvOut" readonly>${esc(csv)}</textarea></div>
    <div class="d-actions"><button class="btn" value="cancel" formnovalidate>Schließen</button><button class="btn" type="button" id="csvDl">Datei speichern</button><button class="btn dark" type="submit">Kopieren</button></div>`,
  () => {
    const ta = $("#csvOut");
    const fallback = () => { ta.focus(); ta.select(); toast("Text markiert – mit Strg/Cmd + C kopieren"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(csv).then(() => { toast("In die Zwischenablage kopiert"); dlg.close(); }, fallback);
    else fallback();
    return false;
  });
  $("#csvDl").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

/* =========================================================
   Hintergrund
   ========================================================= */
function applyScene() {
  document.documentElement.dataset.scene = S.scene === "evening" ? "evening" : "day";
  const sc = $("#scene");
  sc.classList.toggle("custom", !!S.bg);
  sc.style.backgroundImage = S.bg ? `url(${S.bg})` : "";
}
function downscale(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .72));
    };
    img.onerror = () => rej(new Error("Bild konnte nicht gelesen werden"));
    img.src = url;
  });
}

/* =========================================================
   Steuerung
   ========================================================= */
const toastEl = $("#toast");
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 3200); }
function persist(ok, fail) { toast(save() ? ok : (fail || ok + " – Speichern im Browser nicht möglich")); }

const RENDER = { overview: renderOverview, reports: renderReports, goals: renderGoals, activity: renderActivity, account: renderAccount };
function render() { renderChrome(); RENDER[page](); }

function go(id, animate = true) {
  if (!RENDER[id]) id = "overview";
  page = id; hideTip();
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.dataset.page === id));
  render();
  const sec = $("#p-" + id);
  if (animate) {
    sec.querySelectorAll(".page-head, .card").forEach((c, i) => c.style.setProperty("--i", Math.min(i, 12)));
    sec.classList.remove("enter"); void sec.offsetWidth; sec.classList.add("enter");
    clearTimeout(sec._t); sec._t = setTimeout(() => sec.classList.remove("enter"), 1500);
  }
  try { history.replaceState(null, "", "#" + id); } catch (_) {}
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-range],[data-addmoney],[data-month],[data-scene],[data-afilter],[data-sort]");
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (t.dataset.range) { S.range = +t.dataset.range; save(); renderReports(); return; }
  if (t.dataset.addmoney != null) return addMoney(+t.dataset.addmoney);
  if (t.dataset.afilter) { ui.afilter = t.dataset.afilter; renderActivity(); return; }
  if (t.dataset.sort) { const k = t.dataset.sort; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : (k === "date" || k === "amount" ? -1 : 1) }; renderActivity(); return; }
  if (t.dataset.month) { const r = S.months.find(x => x.monat === t.dataset.month); return showCSV(`Abschluss ${mLong(r.monat)}`, toCSV([r]), `abschluss-${r.monat}.csv`); }
  if (t.dataset.scene) { S.scene = t.dataset.scene; S.bg = null; applyScene(); persist("Darstellung gespeichert"); renderAccount(); return; }
  switch (t.dataset.act) {
    case "quick": return quickAdd();
    case "newgoal": return newGoal();
    case "budget": return editBudget();
    case "export": return showCSV("Kennzahlen exportieren", toCSV(S.months), "kennzahlen.csv");
    case "import": return $("#csvFile").click();
    case "reset": return confirmReset();
    case "bgupload": return $("#bgFile").click();
    case "bgreset": S.bg = null; applyScene(); persist("Foto entfernt"); renderAccount(); return;
  }
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.auto;
  if (k) { S.auto[k] = e.target.checked; persist(e.target.checked ? "Automatik aktiviert" : "Automatik deaktiviert"); renderGoals(); }
});

/* Assistent */
const aIn = $("#assistInput"), ans = $("#answer");
$("#assistForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = aIn.value.trim(); if (!q) return;
  const r = answer(q);
  ans.innerHTML = `<button class="close" type="button" aria-label="Antwort schließen">×</button><div class="sub" style="margin-bottom:4px">${esc(q)}</div>${r.html}`;
  ans.hidden = false;
  ans.querySelector(".close").onclick = () => { ans.hidden = true; };
  if (r.go && r.go !== page) go(r.go);
  aIn.value = "";
});
(function typePlaceholder() {
  let pi = 0, ci = 0, dir = 1;
  setInterval(() => {
    if (document.activeElement === aIn || aIn.value) return;
    const p = PROMPTS[pi];
    ci += dir;
    if (ci > p.length + 18) { dir = -1; ci = p.length; }
    if (ci <= 0 && dir < 0) { dir = 1; ci = 0; pi = (pi + 1) % PROMPTS.length; }
    aIn.placeholder = p.slice(0, Math.min(ci, p.length)) + (ci <= p.length ? "|" : "");
  }, 55);
})();

/* Benachrichtigungen */
const bell = $("#bellBtn"), notes = $("#notes");
bell.addEventListener("click", e => {
  e.stopPropagation();
  const open = notes.hidden;
  if (open) notes.innerHTML = `<h3>Hinweise</h3>` + notifications().map(n => `<div class="note"><i style="background:${n.c}"></i><span>${n.t}</span></div>`).join("");
  notes.hidden = !open; bell.setAttribute("aria-expanded", open);
});
document.addEventListener("click", e => { if (!notes.hidden && !notes.contains(e.target) && e.target !== bell) { notes.hidden = true; bell.setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { notes.hidden = true; ans.hidden = true; } });

/* Neu zeichnen bei Größenänderung */
let rz, lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(() => RENDER[page](), 150); });

const st = document.createElement("style");
st.textContent = "@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}";
document.head.appendChild(st);

applyScene();
go((location.hash || "").slice(1) || "overview");
</script>
